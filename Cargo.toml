[package]
name = "node-forge-render-server"
version = "0.1.0"
edition = "2024"
build = "build.rs"
default-run = "node-forge-render-server"

[features]
default = ["native"]
native = [
    "rust-wgpu-fiber/native",
    "dep:arboard",
    "dep:ahash",
    "dep:crossbeam-channel",
    "dep:deno_core",
    "dep:notify",
    "dep:rayon",
    "dep:rfd",
    "dep:rusqlite",
    "dep:similar",
    "dep:tungstenite",
    "dep:libloading",
    "dep:libc",
]
portable-js = ["dep:rquickjs"]
android-core = ["rust-wgpu-fiber/android-core", "portable-js", "dep:tungstenite"]
web-core = [
    "rust-wgpu-fiber/web-core",
    "dep:js-sys",
    "dep:serde-wasm-bindgen",
    "dep:wasm-bindgen",
]

[dependencies]
node-forge-resource-store = { path = "../node-forge-editor/packages/document/native" }
rust-wgpu-fiber = { version = "*", path = "../rust-wgpu-fiber", default-features = false }
rquickjs = { package = "rquickjs-core", version = "0.14", features = ["bindgen"], optional = true }
anyhow = "1"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tiff = "0.10.3"
cosmic-text = { version = "0.19", default-features = false, features = ["std", "swash"] }
unicode-script = "0.5"
crossbeam-channel = { version = "0.5", optional = true }
libloading = { version = "0.8", optional = true }
libc = { version = "0.2", optional = true }
tungstenite = { version = "0.21", optional = true }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "exr"] }
png = "0.18"
crc32fast = "1"
exr = "1.74"
rusqlite = { version = "0.32.1", features = ["bundled"], optional = true }
# Used for WGSL validation at runtime and in tests
naga = { version = "0.20", features = ["wgsl-in", "glsl-in", "wgsl-out"] }
ahash = { version = "0.8", optional = true }
similar = { version = "2", optional = true }

notify = { version = "7", default-features = false, features = ["macos_fsevent"], optional = true }
deno_core = { version = "0.380.0", features = ["include_icu_data"], optional = true }
arboard = { version = "3", optional = true }
bytemuck = { version = "1", features = ["derive"] }
rayon = { version = "1", optional = true }
half = "2"
rfd = { version = "0.15", optional = true }
gltf = { version = "1", features = ["extras"] }
tobj = { version = "4", default-features = false }
js-sys = { version = "0.3", optional = true }
serde-wasm-bindgen = { version = "0.6", optional = true }
wasm-bindgen = { version = "0.2", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-time = "1"

[[bin]]
name = "node-forge-render-server"
path = "src/main.rs"
required-features = ["native"]

[[bin]]
name = "pixel-perfecto"
path = "src/bin/pixel-perfecto.rs"
required-features = ["native"]

[[bin]]
name = "camera-studio"
path = "src/bin/camera-studio.rs"
required-features = ["native"]

[[bin]]
name = "android-player-check"
path = "src/bin/android-player-check.rs"
required-features = ["native"]

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.23"
metal = "0.32"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSPasteboard"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSData"] }

[patch.crates-io]
eframe = { path = "third_party/eframe" }
egui-wgpu = { path = "third_party/egui-wgpu" }
wgpu-hal = { path = "third_party/wgpu-hal" }
block = { path = "third_party/block" }

[dev-dependencies]
proptest = "1"
# Structural headless validation fallback for CI hosts without a native GPU.
# The noop backend never replaces pixel comparison when a real adapter exists.
wgpu = { version = "30.0.1", default-features = false, features = ["noop"] }

# The desktop development flow runs this profile continuously. Optimizing the renderer and its
# graphics dependencies avoids debug-only Metal/Objective-C validation overhead in every frame,
# while retaining debug symbols and assertions in this crate.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
debug-assertions = false

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[[bin]]
name = "screen-test"
path = "src/bin/screen-test.rs"
required-features = ["native"]
