[package]
name = "node-forge-web-player"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
anyhow = "1"
js-sys = "0.3"
log = "0.4"
node-forge-render-server = { path = "../..", default-features = false, features = ["web-core"] }
rust-wgpu-fiber = { path = "../../../rust-wgpu-fiber", default-features = false, features = ["web-core"] }
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
serde_json = "1"
serde-wasm-bindgen = "0.6"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Document", "Element", "HtmlCanvasElement", "Window"] }

[patch.crates-io]
eframe = { path = "../../third_party/eframe" }
egui-wgpu = { path = "../../third_party/egui-wgpu" }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[workspace]
